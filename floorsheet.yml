name: NEPSE Floor Sheet CSV

on:
  # Run after the NEPSE market close: 15:30 Nepal time = 09:45 UTC.
  # Nepal trading days are Sunday–Thursday.
  schedule:
    - cron: "45 9 * * 0-4"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Historical start date (YYYY-MM-DD). Leave blank for today's Nepal date."
        required: false
        type: string
      to_date:
        description: "Historical end date (YYYY-MM-DD). Leave blank to use from_date."
        required: false
        type: string
      retry_existing:
        description: "Re-fetch dates with EMPTY/FAILED status"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nepse-floorsheet-csv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install NEPSE client
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/basic-bgnr/NepseUnofficialApi.git"

      - name: Download and validate floor sheets
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          RETRY_EXISTING: ${{ inputs.retry_existing }}
        run: |
          ARGS=()
          if [ -n "$FROM_DATE" ]; then ARGS+=(--from-date "$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then ARGS+=(--to-date "$TO_DATE"); fi
          if [ "$RETRY_EXISTING" = "true" ]; then ARGS+=(--retry-existing); fi
          python scripts/fetch_floorsheet.py "${ARGS[@]}"

      - name: Commit CSVs and status log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/floorsheet
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update NEPSE floor-sheet CSV archive"
            git push
          fi
